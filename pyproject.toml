[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chain-pair-simplification"
version = "1.0.1.dev0"
description = "Prepared-input reproduction package for chain pair simplification"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["curve_algorithms", "cps_paper_algorithms", "verify_cps_papers"]
